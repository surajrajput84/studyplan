<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Study Planner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      font-family: 'Poppins', system-ui, sans-serif;
      background: #000000;
    }

    /* Left Section - Signup Card */
    .left-section {
      width: 35%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
      background: #000000;
      padding: 20px;
      overflow-y: auto;
    }

    .auth-box {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .auth-logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 12px;
    }

    .auth-title {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1a202c;
    }

    .auth-subtitle {
      text-align: center;
      color: #718096;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #2d3748;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.2s;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn-auth {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-auth:hover {
      background: #5568d3;
      transform: translateY(-1px);
    }

    .auth-divider {
      text-align: center;
      margin: 24px 0;
      color: #a0aec0;
      position: relative;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #e2e8f0;
    }

    .auth-divider::before { left: 0; }
    .auth-divider::after { right: 0; }

    .auth-link {
      text-align: center;
      margin-top: 20px;
      color: #718096;
    }

    .auth-link a {
      color: #667eea;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    .error-msg {
      background: #fed7d7;
      color: #c53030;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    /* Right Section - Animated Background */
    .right-section {
      width: 65%;
      position: relative;
      overflow: hidden;
      background: #000000;
    }

    /* Floating Gradient Blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 20s infinite ease-in-out;
    }

    .blob1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(82, 39, 255, 0.15), transparent);
      top: -10%;
      left: 10%;
      animation-delay: 0s;
    }

    .blob2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.12), transparent);
      top: 40%;
      right: -5%;
      animation-delay: 5s;
    }

    .blob3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.12), transparent);
      bottom: -10%;
      left: 20%;
      animation-delay: 10s;
    }

    .blob4 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.1), transparent);
      top: 20%;
      left: 40%;
      animation-delay: 15s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      25% {
        transform: translate(80px, -80px) scale(1.1);
      }
      50% {
        transform: translate(-50px, 80px) scale(0.9);
      }
      75% {
        transform: translate(60px, 50px) scale(1.05);
      }
    }

    /* Animated Grid */
    .grid-container {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(82, 39, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(82, 39, 255, 0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 30s linear infinite;
      opacity: 0.2;
    }

    @keyframes gridMove {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(60px, 60px);
      }
    }

    /* Particles */
    .particles-container {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(82, 39, 255, 0.4);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(82, 39, 255, 0.4);
      animation: particleDrift 20s infinite ease-in-out;
    }

    .particle:nth-child(1) { top: 15%; left: 15%; animation-delay: 0s; }
    .particle:nth-child(2) { top: 35%; left: 55%; animation-delay: 4s; }
    .particle:nth-child(3) { top: 55%; left: 25%; animation-delay: 8s; }
    .particle:nth-child(4) { top: 75%; left: 65%; animation-delay: 12s; }
    .particle:nth-child(5) { top: 25%; left: 75%; animation-delay: 16s; }
    .particle:nth-child(6) { top: 65%; left: 45%; animation-delay: 2s; }
    .particle:nth-child(7) { top: 45%; left: 85%; animation-delay: 6s; }
    .particle:nth-child(8) { top: 85%; left: 35%; animation-delay: 10s; }

    @keyframes particleDrift {
      0%, 100% {
        transform: translate(0, 0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      50% {
        transform: translate(150px, -150px);
      }
    }

    /* Light Sweep */
    .light-sweep {
      position: absolute;
      width: 200%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(82, 39, 255, 0.05),
        transparent
      );
      animation: sweep 10s infinite ease-in-out;
    }

    @keyframes sweep {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    /* Glow Orbs */
    .glow-orb {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(82, 39, 255, 0.15), transparent);
      filter: blur(50px);
      animation: pulse 5s infinite ease-in-out;
    }

    .glow-orb:nth-child(1) { 
      top: 10%; 
      right: 15%; 
      animation-delay: 0s; 
    }
    
    .glow-orb:nth-child(2) { 
      bottom: 15%; 
      left: 10%; 
      animation-delay: 2.5s;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15), transparent);
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.3);
        opacity: 0.8;
      }
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .left-section {
        width: 45%;
      }
      .right-section {
        width: 55%;
      }
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .left-section {
        width: 100%;
        min-height: 100vh;
      }
      .right-section {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Left Section: Signup Card -->
  <div class="left-section">
    <div class="auth-box">
      <div class="auth-logo">📘</div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Start your learning journey today</p>

      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/signup">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-input" placeholder="johndoe" required minlength="3">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-input" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="btn-auth">Create Account</button>
      </form>

      <div class="auth-divider">or</div>

      <div class="auth-link">
        Already have an account? <a href="/login">Login</a>
      </div>
    </div>
  </div>

  <!-- Right Section: Animated Background -->
  <div class="right-section">
    <div style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 60px;">
      <h1 id="motivational-quote" style="font-size: 48px; font-weight: 300; color: rgba(255, 255, 255, 0.9); text-align: center; line-height: 1.4; letter-spacing: 2px; font-family: 'Georgia', serif;">
      </h1>
    </div>
  </div>

  <script>
    const quotes = [
      "Clarity in concepts,<br>power in consistency",
      "Study is not about intensity,<br>it's about consistency.",
      "Small daily progress in study<br>creates big results over time.",
      "Consistency turns average<br>students into toppers.",
      "You don't need motivation every day,<br>you need discipline every day.",
      "Study a little every day —<br>that's how mastery is built.",
      "Success in study is a habit,<br>not a one-day effort.",
      "Consistency beats talent<br>when talent is inconsistent.",
      "One focused hour daily is better<br>than ten distracted hours once a week.",
      "Your future is decided<br>by what you study today.",
      "Keep showing up.<br>Even on the days you don't feel like it."
    ];
    
    const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById('motivational-quote').innerHTML = randomQuote;
  </script>
</body>
</html>

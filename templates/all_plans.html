<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Plans — Study Planner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">📘</div>
    <div>
      <div class="logo-text">Study Planner</div>
      <div class="logo-sub">Track your progress</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-section-label">Main Menu</div>
    <a href="/" class="nav-item"><span class="ni">🏠</span> Dashboard</a>
    <a href="/all-plans" class="nav-item active"><span class="ni">📚</span> My Plans</a>
    <a href="/all-calendar" class="nav-item"><span class="ni">📅</span> Calendar</a>
    <a href="/all-progress" class="nav-item"><span class="ni">📊</span> Statistics</a>
    <div class="sidebar-section-label" style="margin-top:12px;">Account</div>
    <a href="/logout" class="nav-item"><span class="ni">🚪</span> Logout</a>
  </nav>
</div>

<div class="main-area">
  <div class="topheader">
    <div class="topheader-left">
      <div class="greeting">My Study Plans 📚</div>
      <div class="greeting-sub">All your learning journeys in one place</div>
    </div>
    <div class="topheader-right">
      <a href="/create" class="btn btn-primary">+ Create New Plan</a>
    </div>
  </div>

  <div class="page-content">
    <div id="plans-container"></div>
  </div>
</div>

<script>
const COLORS = ['sc-blue','sc-purple','sc-green','sc-orange'];
const ICONS  = ['💻','🧩','🌐','⚙️'];

async function loadPlans() {
  const res = await fetch('/dashboard-data');
  const data = await res.json();
  
  const container = document.getElementById('plans-container');
  
  if (!data.plans.length) {
    container.innerHTML = `
      <div class="card" style="text-align:center;padding:48px;">
        <div style="font-size:64px;margin-bottom:16px;">📭</div>
        <h2>No Plans Yet</h2>
        <p class="empty">Create your first study plan to get started</p>
        <a href="/create" class="btn btn-primary" style="margin-top:20px;">+ Create Plan</a>
      </div>`;
    return;
  }
  
  container.innerHTML = data.plans.map((p, i) => `
    <div class="card" style="margin-bottom:20px;">
      <div style="display:flex;gap:20px;align-items:start;">
        <div class="pc-icon ${COLORS[i % 4]}" style="font-size:32px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;">
          ${ICONS[i % 4]}
        </div>
        <div style="flex:1;">
          <h2 style="margin:0 0 8px 0;">${p.title}</h2>
          <div style="color:var(--text-3);margin-bottom:12px;">
            <span class="subject-tag">${p.subject}</span> · ${p.created_at} · ${p.total} days
          </div>
          <div class="prog-wrap" style="margin-bottom:12px;">
            <div class="prog-bg"><div class="prog-fill" style="width:${p.percent}%"></div></div>
            <div class="prog-pct">${p.percent}%</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <a href="/plan/${p.id}/weeks" class="btn btn-primary btn-sm">Open Plan →</a>
            <a href="/plan/${p.id}/dashboard" class="btn btn-ghost btn-sm">📊 Progress</a>
            <a href="/plan/${p.id}/calendar" class="btn btn-ghost btn-sm">📅 Calendar</a>
            <button class="btn btn-danger btn-sm" onclick="deletePlan('${p.id}','${p.title.replace(/'/g,"\\'")}')">🗑 Delete</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

async function deletePlan(id, title) {
  if (!confirm(`Delete "${title}"?\n\nAll weeks and days will be permanently removed.`)) return;
  await fetch(`/plan/${id}`, {method: 'DELETE'});
  location.reload();
}

loadPlans();
</script>
</body>
</html>
